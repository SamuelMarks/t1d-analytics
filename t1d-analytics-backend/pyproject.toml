[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "t1d-analytics"
version = "0.1.0"
description = "Downloader and analytics suite for T1D public datasets"
authors = [{name = "Samuel"}]
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.optional-dependencies]
training = [
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "torch>=2.0.0",
    "bitsandbytes>=0.43.0",
]

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/t1d_analytics"]

[project.scripts]
t1d-analytics = "t1d_analytics.cli:main"

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "t1d-analytics-backend/src", "../scripts", "scripts"]
lint.select = ["E", "F", "I", "D", "B", "UP", "SIM", "C4", "PIE", "RUF"]
lint.ignore = ["D203", "D212", "E501", "UP006", "UP007", "UP015", "UP035", "UP037", "UP045", "SIM105", "SIM108", "SIM117", "B008", "RUF001", "RUF002"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
mypy_path = ["src", "t1d-analytics-backend/src", "..", "."]

[[tool.mypy.overrides]]
module = [
    "any_llm",
    "any_llm.*",
    "pandas",
    "pandas.*",
    "pyreadstat",
    "pyreadstat.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "peft",
    "peft.*"
]
ignore_missing_imports = true
follow_imports = "silent"
disallow_untyped_calls = false

[tool.pytest.ini_options]
addopts = "--cov=t1d_analytics --cov=scripts.run_tests --cov=docs_src --cov-branch --cov-report=term-missing --cov-report=html --cov-report=lcov --cov-fail-under=100"
pythonpath = ["src", ".", ".."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
sigterm = true
concurrency = ["multiprocessing", "thread"]
parallel = true
omit = ["tests/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "if TYPE_CHECKING:",
    "class .*\\(Protocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
]

[tool.interrogate]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-setters = false
fail-under = 100
verbose = 2
