[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "t1d-analytics"
version = "0.1.0"
description = "Downloader and analytics suite for T1D public datasets"
authors = [{name = "Samuel"}]
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
training = [
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "torch>=2.0.0",
    "bitsandbytes>=0.43.0",
]

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[project.scripts]
t1d-analytics = "t1d_analytics.cli:main"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]
lint.select = ["E", "F", "I", "D"]
lint.ignore = ["D203", "D212", "E501"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_unused_ignores = false
mypy_path = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=t1d_analytics --cov=scripts.run_tests --cov-branch --cov-report=term-missing --cov-report=html --cov-report=lcov --cov-fail-under=100"
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src/t1d_analytics", "scripts/run_tests.py"]
branch = true
sigterm = true
concurrency = ["multiprocessing", "thread"]
parallel = true

[tool.coverage.report]
show_missing = true

[tool.interrogate]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-setters = false
fail-under = 100
verbose = 2
