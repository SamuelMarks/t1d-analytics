name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  python-tests:
    name: Python Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "t1d-analytics-backend/requirements*.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r t1d-analytics-backend/requirements.txt -r t1d-analytics-backend/requirements-dev.txt
          pip install -e t1d-analytics-backend

      - name: Lint and Code Quality (Ruff)
        run: ruff check --config t1d-analytics-backend/pyproject.toml t1d-analytics-backend scripts

      - name: Static Type Checking (Mypy)
        run: mypy --config-file t1d-analytics-backend/pyproject.toml t1d-analytics-backend/src/ t1d-analytics-backend/tests/ scripts/

      - name: Documentation Coverage (Interrogate)
        run: interrogate -c t1d-analytics-backend/pyproject.toml -vv --fail-under=100 t1d-analytics-backend/src/t1d_analytics

      - name: Build Sphinx Documentation
        run: python -m sphinx -b html t1d-analytics-backend/docs_src docs

      - name: Run Pytest Coverage
        run: pytest -c t1d-analytics-backend/pyproject.toml t1d-analytics-backend/tests/ --cov=t1d-analytics-backend/src/t1d_analytics --cov-fail-under=100

      - name: Integration Test - Tiny Dataset Load
        run: |
          mkdir -p t1d-analytics-backend/tests/test_data
          echo "id,name,value" > t1d-analytics-backend/tests/test_data/tiny.csv
          echo "1,Test A,100" >> t1d-analytics-backend/tests/test_data/tiny.csv
          echo "2,Test B,200" >> t1d-analytics-backend/tests/test_data/tiny.csv

          # Load tiny dataset into DuckDB
          python -c "from t1d_analytics.analytics import load_data_to_duckdb; load_data_to_duckdb('t1d-analytics-backend/tests/test_data/', 'ci_test.duckdb')"

          # Verify the database has the data
          python -c "import duckdb; conn = duckdb.connect('ci_test.duckdb'); res = conn.execute('SELECT count(*) FROM tiny').fetchone()[0]; assert res == 2, f'Expected 2 rows, got {res}'"

      - name: Validate Cloud Deployment Script Mock Mode
        run: ./test.sh --mock-cloud

  web-tests:
    name: Web Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: t1d-analytics-web/package-lock.json

      - name: Install NPM dependencies
        working-directory: ./t1d-analytics-web
        run: npm ci

      - name: Static Type Checking (TypeScript)
        working-directory: ./t1d-analytics-web
        run: npm run typecheck

      - name: Build Web Application
        working-directory: ./t1d-analytics-web
        run: npm run build

      - name: Generate TypeScript Documentation (TypeDoc)
        working-directory: ./t1d-analytics-web
        run: npm run docs

      - name: Run Web Unit Tests (Vitest)
        working-directory: ./t1d-analytics-web
        run: npm run coverage

      - name: Install Playwright Browsers
        working-directory: ./t1d-analytics-web
        run: npx playwright install --with-deps chromium

      - name: Run Web E2E Tests (Playwright)
        working-directory: ./t1d-analytics-web
        run: npx playwright test --project=chromium

      - name: Set up Python for Backend
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "t1d-analytics-backend/requirements*.txt"

      - name: Install Python dependencies for Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r t1d-analytics-backend/requirements.txt -r t1d-analytics-backend/requirements-dev.txt
          pip install -e t1d-analytics-backend

      - name: Setup Backend for Full E2E
        run: |
          mkdir -p t1d-analytics-backend/tests/test_data
          echo "id,name,value" > t1d-analytics-backend/tests/test_data/tiny.csv
          echo "1,Test A,100" >> t1d-analytics-backend/tests/test_data/tiny.csv
          echo "2,Test B,200" >> t1d-analytics-backend/tests/test_data/tiny.csv
          echo "id,name,age" > t1d-analytics-backend/tests/test_data/patients.csv
          echo "1,Alice,30" >> t1d-analytics-backend/tests/test_data/patients.csv
          echo "2,Bob,40" >> t1d-analytics-backend/tests/test_data/patients.csv
          t1d-analytics load -d t1d-analytics-backend/tests/test_data --db ci_test.duckdb

      - name: Run Web E2E Full Stack Tests (Playwright)
        working-directory: ./t1d-analytics-web
        env:
          T1D_DB_PATH: ../ci_test.duckdb
        run: npx playwright test tests-e2e-full -c playwright.full.config.ts

      - name: Archive Playwright Test Reports & Traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            t1d-analytics-web/playwright-report/
            t1d-analytics-web/test-results/
          retention-days: 7
