name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  python-tests:
    name: Python Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            t1d-analytics-backend/requirements.txt
            t1d-analytics-backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r t1d-analytics-backend/requirements-dev.txt
          pip install -e "t1d-analytics-backend[training]"

      - name: Lint, Format & Strict Typecheck with Ruff & Mypy
        run: |
          ruff check --config t1d-analytics-backend/pyproject.toml t1d-analytics-backend scripts
          ruff format --check --config t1d-analytics-backend/pyproject.toml t1d-analytics-backend scripts
          mypy --config-file t1d-analytics-backend/pyproject.toml --strict t1d-analytics-backend/src t1d-analytics-backend/tests scripts

      - name: Check 100% Docstring & Sphinx Documentation Coverage
        run: |
          interrogate -c t1d-analytics-backend/pyproject.toml -vv --fail-under=100 t1d-analytics-backend/src/t1d_analytics t1d-analytics-backend/tests t1d-analytics-backend/docs_src scripts
          python -m sphinx -W --keep-going -b html t1d-analytics-backend/docs_src docs

      - name: Run Pytest with 100% Line, Branch & Function Coverage Gate
        run: |
          pytest -c t1d-analytics-backend/pyproject.toml t1d-analytics-backend/tests/ --cov-report=json --cov-report=lcov --cov-fail-under=100
          python -c "from scripts.run_tests import audit_python_function_coverage, audit_forbidden_coverage_ignores; assert not audit_forbidden_coverage_ignores(['t1d-analytics-backend/src']); tot, cov, unc = audit_python_function_coverage('coverage.json', ['t1d-analytics-backend/src/t1d_analytics', 'scripts']); assert not unc, unc"

      - name: Verify CLI Entrypoint & Seed Smoke Check
        run: |
          t1d-analytics --help
          python -c "from t1d_analytics.ingestion import load_data_to_duckdb; assert callable(load_data_to_duckdb)"
          mkdir -p t1d-analytics-backend/tests/test_data
          t1d-analytics seed -d t1d-analytics-backend/tests/test_data --db ci_test.duckdb
          rm -rf ci_test.duckdb ci_test.duckdb.wal t1d-analytics-backend/tests/test_data

  web-tests:
    name: Web UI Build & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: t1d-analytics-web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: t1d-analytics-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and TypeScript types
        run: |
          npm run format:check
          npm run lint
          python3 -c "import sys; sys.path.insert(0, '..'); from scripts.run_tests import audit_forbidden_coverage_ignores; assert not audit_forbidden_coverage_ignores(['src'])"

      - name: Build production assets and API docs
        run: |
          npm run build
          npm run docs

      - name: Run Vitest with 100% Line, Branch, Function & Statement Coverage Gate
        run: npm run test:coverage

  e2e-tests:
    name: Full-Stack Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [python-tests, web-tests]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            t1d-analytics-backend/requirements.txt
            t1d-analytics-backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: t1d-analytics-web/package-lock.json

      - name: Install Backend & Frontend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r t1d-analytics-backend/requirements-dev.txt
          pip install -e "t1d-analytics-backend[training]"
          cd t1d-analytics-web && npm ci
          npx playwright install --with-deps chromium

      - name: Run Full-Stack Test & Combined Line/Branch/Function Coverage Orchestrator
        env:
          T1D_SKIP_README_SHIELD_UPDATE: "1"
        run: python scripts/run_tests.py

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            t1d-analytics-web/playwright-report/
            t1d-analytics-web/test-results/
          if-no-files-found: ignore
          retention-days: 7
